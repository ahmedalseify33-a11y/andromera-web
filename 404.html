<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Andromera</title>
  <meta name="robots" content="noindex">
  <link rel="preload" href="/assets/fonts/CormorantGaramond-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    .error-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--gutter);
    }
    .error-page__code {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--step-4);
      color: var(--glow);
      letter-spacing: -0.02em;
    }
    .error-page__title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--step-2);
      color: var(--paper);
      margin-top: 0.5rem;
      letter-spacing: -0.02em;
    }
    .error-page__text {
      font-size: var(--step--1);
      color: var(--paper-45);
      margin-top: 1rem;
      max-width: 40ch;
    }
    .error-page__link {
      display: inline-block;
      margin-top: 2rem;
      font-family: var(--font-mono);
      font-size: var(--step--1);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--glow);
      border: 1px solid var(--glow);
      padding: 0.625rem 1.25rem;
      transition: background-color 200ms var(--ease), color 200ms var(--ease);
    }
    .error-page__link:hover,
    .error-page__link:focus-visible {
      background: var(--glow);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="error-page">
    <p class="error-page__code">404</p>
    <h1 class="error-page__title">Page not found</h1>
    <p class="error-page__text">The page you're looking for doesn't exist or has moved.</p>
    <a href="/" class="error-page__link">Back to home</a>
  </main>
</body>
</html>
